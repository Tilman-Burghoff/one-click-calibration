[metadata]
name = camera_calibration
version = 0.1.0
author = Tilman Burghoff
description = A tool for the calibration of realsense cameras on pandas
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
# url = https://github.com/Tilman-Burghoff/camera_calibration TODO
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
package_dir =
    = .
packages = find:
python_requires = >=3.10
install_requires =
    robotic >= 0.3.4 
    numpy >= 2.0.0

[options.entry_points]
console_scripts =
    calibrate-realsense = camera_calibration.end_to_end_script:main
