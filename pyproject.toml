[project]
name = "camera_calibration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tilman Burghoff", email = "t.burghoff@campus.tu-berlin.de" }
]
requires-python = ">=3.10"
dependencies = [
    "robotic>=0.3.5",
    "numpy >= 2.0.0",
    "opencv-python >= 4.7.0",
    "h5py",
    "pybind11>=3.0.1",
]

[project.scripts]
camera_calibration = "camera_calibration.cli:cli"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
